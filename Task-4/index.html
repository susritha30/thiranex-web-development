<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time weather dashboard using a REST API.">
    <title>Weather Dashboard | Thiranex Task 4</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Weather Dashboard</h1>
        <p>Check real-time weather information</p>
    </header>

    <main>
        <section class="weather-container" aria-labelledby="weather-heading">

            <h2 id="weather-heading">Search Weather</h2>

            <form id="weather-form">
                <label for="city-input">Enter city name</label>

                <div class="search-group">
                    <input
                        type="text"
                        id="city-input"
                        placeholder="e.g. Hyderabad"
                        required
                    >
                    <button type="submit">Search</button>
                </div>
            </form>

            <p id="message" aria-live="polite"></p>

            <div id="weather-result" class="weather-result" hidden>

                <h2 id="city-name"></h2>

                <div class="weather-grid">

                    <article>
                        <h3>Temperature</h3>
                        <p id="temperature"></p>
                    </article>

                    <article>
                        <h3>Humidity</h3>
                        <p id="humidity"></p>
                    </article>

                    <article>
                        <h3>Wind Speed</h3>
                        <p id="wind-speed"></p>
                    </article>

                </div>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Susritha | Thiranex Internship</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
