<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="ShopEase - A responsive e-commerce product catalog."
    >

    <title>ShopEase | Product Catalog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar" aria-label="Main navigation">

            <a href="#home" class="logo">ShopEase</a>

            <div class="nav-links">
                <a href="#home">Home</a>

                <a href="#products">Products</a>

                <a href="#cart">
                    Cart (<span id="cart-count">0</span>)
                </a>
            </div>

        </nav>
    </header>


    <main id="app">

        <!-- Home -->
        <section id="home" class="page">

            <div class="hero">

                <h1>Welcome to ShopEase</h1>

                <p>
                    Discover quality products at affordable prices.
                </p>

                <a href="#products" class="btn">
                    Shop Now
                </a>

            </div>

        </section>


        <!-- Products -->
        <section id="products" class="page">

            <div class="section-heading">

                <h2>Our Products</h2>

                <p>
                    Browse our collection and find what you need.
                </p>

            </div>


            <div class="product-controls">

                <input
                    type="search"
                    id="search-input"
                    placeholder="Search products..."
                    aria-label="Search products"
                >


                <select
                    id="category-filter"
                    aria-label="Filter by category"
                >

                    <option value="all">
                        All Categories
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Fashion">
                        Fashion
                    </option>

                    <option value="Home">
                        Home
                    </option>

                </select>

            </div>


            <div
                id="product-list"
                class="product-grid"
            >
                <!-- Products will be created using JavaScript -->
            </div>

        </section>


        <!-- Product Details -->
        <section
            id="product-details"
            class="page"
            hidden
        >

            <button
                id="back-to-products"
                class="btn"
                type="button"
            >
                ← Back to Products
            </button>


            <div id="details-content">
                <!-- Product details will be displayed here -->
            </div>

        </section>


        <!-- Cart -->
        <section id="cart" class="page">

            <div class="section-heading">

                <h2>Shopping Cart</h2>

            </div>


            <div id="cart-items">
                <!-- Cart items will be created using JavaScript -->
            </div>


            <div class="cart-summary">

                <h3>
                    Total:
                    ₹<span id="cart-total">0</span>
                </h3>

            </div>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 Susritha | Thiranex Internship
        </p>

    </footer>


    <script
        type="module"
        src="js/app.js"
    ></script>

</body>
</html>
